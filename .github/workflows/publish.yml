name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run check

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Deliberately no registry-url: setup-node writes an .npmrc with an
          # empty token placeholder, which makes npm skip OIDC and fail ENEEDAUTH.

      - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
        run: npm install -g npm@latest

      # No token: npm exchanges the GitHub OIDC token for a short-lived
      # publish credential. Provenance is attached automatically.
      - name: Publish to npm
        run: npm publish --access public
